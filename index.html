<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { padding: 15px 15px 0 15px; background-color: #f9f9f9; min-height: 100vh; display: flex; flex-direction: column; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; position: sticky; top: 0; z-index: 100; }
    .brand { font-weight: bold; font-size: 1.1rem; color: #4a3b32; }
    .cart-status { background: #e8f5e9; color: #2e7d32; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; border: 1px solid #a5d6a7; }
    
    .category-header { background: #4a3b32; color: #fff; padding: 10px 15px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; margin: 25px 0 15px 0; }
    .category-header:first-of-type { margin-top: 0; }
    
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .product-card { background: #fff; border-radius: 8px; padding: 12px; border: 1px solid #eee; display: flex; flex-direction: column; justify-content: space-between; }
    .product-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
    .product-title { font-size: 0.95rem; font-weight: bold; color: #333; margin-bottom: 2px; }
    .product-variant { font-size: 0.8rem; color: #666; margin-bottom: 6px; font-weight: 500; }
    .product-price { color: #d32f2f; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; }
    
    .topping-select { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.85rem; margin-bottom: 10px; background: #fff; color: #333; }
    
    .qty-control { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .qty-btn { width: 28px; height: 28px; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .qty-input { width: 40px; text-align: center; border: 1px solid #ccc; border-radius: 4px; padding: 3px; font-weight: bold; }
    .btn-add { width: 100%; background: #4a3b32; color: #fff; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-add:hover { background: #332822; }

    .cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .cart-content { background: #fff; width: 90%; max-width: 400px; border-radius: 10px; padding: 20px; max-height: 80vh; overflow-y: auto; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
    .close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #888; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; border-bottom: 1px dashed #eee; padding-bottom: 5px; }
    .cart-total { font-weight: bold; font-size: 1rem; text-align: right; margin-top: 15px; color: #d32f2f; }
    .btn-checkout { width: 100%; background: #25D366; color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; margin-top: 15px; cursor: pointer; font-size: 0.95rem; }

    /* CUSTOM FOOTER RAMPING & ELEGAT */
    footer { margin-top: auto; background-color: #4a3b32; color: #f0e6df; padding: 15px 20px; border-radius: 8px 8px 0 0; font-size: 0.85rem; }
    .footer-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; max-width: 1200px; margin: 0 auto; }
    .footer-info { display: flex; flex-direction: column; gap: 3px; }
    .footer-brand { font-weight: bold; font-size: 0.95rem; color: #fff; }
    .footer-links { display: flex; gap: 15px; }
    .footer-links a { color: #d7ccc8; text-decoration: none; transition: 0.2s; }
    .footer-links a:hover { color: #fff; text-decoration: underline; }
    .footer-copy { text-align: center; width: 100%; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; margin-top: 8px; font-size: 0.75rem; color: #bcaaa4; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">🍰 Menu Sorean Bake</div>
    <div class="cart-status" onclick="bukaKeranjang()">
      🛒 Keranjang (<span id="cart-count">0</span>)
    </div>
  </div>

  <div id="catalog-container"></div>

  <!-- Pop-Up Keranjang -->
  <div id="cartModal" class="cart-modal">
    <div class="cart-content">
      <div class="cart-header">
        <h3>Keranjang Belanja</h3>
        <button class="close-btn" onclick="tutupKeranjang()">&times;</button>
      </div>
      <div id="cart-items-list">
        <p style="text-align:center; color:#888;">Keranjang masih kosong.</p>
      </div>
      <div class="cart-total" id="cart-total-price">Total: Rp 0</div>
      <button class="btn-checkout" onclick="kirimWhatsApp()">Konfirmasi & Pesan via WA</button>
    </div>
  </div>

  <!-- CUSTOM FOOTER TOKO SOREAN BAKE -->
  <footer>
    <div class="footer-container">
      <div class="footer-info">
        <div class="footer-brand">Sorean Bake</div>
        <div>Freshly Baked Daily | Order Online via WhatsApp</div>
      </div>
      <div class="footer-links">
        <a href="https://wa.me/6287889667929" target="_blank">💬 WhatsApp</a>
        <a href="https://instagram.com" target="_blank">📷 Instagram</a>
      </div>
      <div class="footer-copy">
        &copy; 2026 Toko Sorean Bake. All rights reserved.
      </div>
    </div>
  </footer>

  <script>
    const nomorWA = "6287889667929";

    const listTopping = [
      { nama: "Tanpa Topping", harga: 0 },
      { nama: "Peanut", harga: 5000 },
      { nama: "Keju", harga: 5000 },
      { nama: "Chocochips", harga: 4000 },
      { nama: "Sprinkle", harga: 7000 },
      { nama: "Oreo", harga: 8000 },
      { nama: "Almond Lotus", harga: 8000 },
      { nama: "Fresh Fruit", harga: 8000 }
    ];

    const menuData = [
      {
        kategori: "🍫 Fudgy Brownies",
        items: [
          { id: "br-s", nama: "Fudgy Brownies", varian: "Mini Fudgy Brownies (10x10)", harga: 25000, img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=300" },
          { id: "br-m", nama: "Fudgy Brownies", varian: "Medium Fudgy Brownies (20x10)", harga: 49000, img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=300" },
          { id: "br-l", nama: "Fudgy Brownies", varian: "Large Fudgy  Brownies (22x22)", harga: 85000, img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=300" }
        ]
      },
      {
        kategori: "🧀 Basque Cheesecake",
        items: [
          { id: "bc-s", nama: "Burnt Cheesecake", varian: "Mini Cheesecake (10D)", harga: 35000, img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=300" },
          { id: "bc-m", nama: "Burnt Cheesecake", varian: "Regular Cheesecake (16D)", harga: 65000, img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=300" },
          // { id: "bc-l", nama: "Burnt Cheesecake", varian: "Large (Whole 16cm)", harga: 120000, img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=300" }
        ]
      }
    ];

    let keranjang = [];

    function renderKatalog() {
      const container = document.getElementById('catalog-container');
      container.innerHTML = '';

      menuData.forEach(kat => {
        let categoryHtml = `<div class="category-header">${kat.kategori}</div><div class="product-grid">`;
        
        kat.items.forEach(item => {
          let toppingOptionsHtml = `<select id="${item.id}-topping" class="topping-select">`;
          listTopping.forEach((top, index) => {
            const labelHarga = top.harga > 0 ? ` (+Rp ${top.harga.toLocaleString('id-ID')})` : '';
            toppingOptionsHtml += `<option value="${index}">${top.nama}${labelHarga}</option>`;
          });
          toppingOptionsHtml += `</select>`;

          categoryHtml += `
            <div class="product-card">
              <div>
                <img src="${item.img}" alt="${item.nama}">
                <div class="product-title">${item.nama}</div>
                <div class="product-variant">Varian: ${item.varian}</div>
                <div class="product-price">Rp ${item.harga.toLocaleString('id-ID')}</div>
                ${toppingOptionsHtml}
              </div>
              <div>
                <div class="qty-control">
                  <button class="qty-btn" onclick="ubahQty('${item.id}', -1)">-</button>
                  <input type="number" id="${item.id}-qty" class="qty-input" value="1" min="1" readonly>
                  <button class="qty-btn" onclick="ubahQty('${item.id}', 1)">+</button>
                </div>
                <button class="btn-add" onclick="tambahKeKeranjang('${item.nama}', '${item.varian}', ${item.harga}, '${item.id}')">+ Keranjang</button>
              </div>
            </div>
          `;
        });

        categoryHtml += `</div>`;
        container.innerHTML += categoryHtml;
      });
    }

    function ubahQty(id, delta) {
      const input = document.getElementById(id + '-qty');
      let val = parseInt(input.value) + delta;
      if (val < 1) val = 1;
      input.value = val;
    }

    function tambahKeKeranjang(nama, varian, hargaDasar, itemId) {
      const qty = parseInt(document.getElementById(itemId + '-qty').value);
      const toppingIndex = document.getElementById(itemId + '-topping').value;
      const toppingSelected = listTopping[toppingIndex];

      const hargaTotalItem = hargaDasar + toppingSelected.harga;
      const toppingText = toppingSelected.harga > 0 ? ` [Topping: ${toppingSelected.nama}]` : '';
      const namaLengkap = `${nama} - ${varian}${toppingText}`;

      const index = keranjang.findIndex(item => item.nama === namaLengkap);
      if (index > -1) {
        keranjang[index].qty += qty;
      } else {
        keranjang.push({ nama: namaLengkap, harga: hargaTotalItem, qty });
      }

      document.getElementById(itemId + '-qty').value = 1;
      updateTampilanKeranjang();
      alert(`${namaLengkap} (${qty} pcs) berhasil ditambahkan!`);
    }

    function updateTampilanKeranjang() {
      const cartCount = document.getElementById('cart-count');
      const cartList = document.getElementById('cart-items-list');
      const cartTotal = document.getElementById('cart-total-price');

      let totalItems = 0;
      let totalPrice = 0;
      cartList.innerHTML = '';

      if (keranjang.length === 0) {
        cartList.innerHTML = '<p style="text-align:center; color:#888;">Keranjang masih kosong.</p>';
      } else {
        keranjang.forEach((item) => {
          totalItems += item.qty;
          const subtotal = item.harga * item.qty;
          totalPrice += subtotal;

          cartList.innerHTML += `
            <div class="cart-item">
              <div>
                <strong>${item.nama}</strong><br>
                <small>${item.qty} x Rp ${item.harga.toLocaleString('id-ID')}</small>
              </div>
              <div>Rp ${subtotal.toLocaleString('id-ID')}</div>
            </div>
          `;
        });
      }

      cartCount.innerText = totalItems;
      cartTotal.innerText = 'Total: Rp ' + totalPrice.toLocaleString('id-ID');
    }

    function bukaKeranjang() { document.getElementById('cartModal').style.display = 'flex'; }
    function tutupKeranjang() { document.getElementById('cartModal').style.display = 'none'; }

    function kirimWhatsApp() {
      if (keranjang.length === 0) {
        alert("Keranjang Anda masih kosong!");
        return;
      }

      let pesan = "Halo Toko Sorean Bake, saya mau konfirmasi pesanan berikut:%0A%0A";
      let total = 0;

      keranjang.forEach(item => {
        const subtotal = item.harga * item.qty;
        total += subtotal;
        pesan += `- ${item.nama} (${item.qty} pcs) = Rp ${subtotal.toLocaleString('id-ID')}%0A`;
      });

      pesan += `%0A*Total Pembayaran:* Rp ${total.toLocaleString('id-ID')}`;
      pesan += "%0A%0AMohon diinformasikan alur pembayaran dan pengirimannya. Terima kasih!";

      window.open("https://wa.me/" + nomorWA + "?text=" + pesan, "_blank");
    }

    renderKatalog();
  </script>
</body>
</html>
