<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorean Bake - Katalog</title>
  <style>
    html, body {
      height: auto !important;
      min-height: 0 !important;
      overflow: visible !important;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    
    html {
      height: max-content !important;
    }
    
    body { 
      background-color: #f9f9f9; 
      padding: 12px; 
      display: flex; 
      flex-direction: column; 
      height: auto !important;
      min-height: unset !important;
    }
    
    .top-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 10px 15px; 
      background: #fff; 
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
      margin-bottom: 15px; 
      position: sticky; 
      top: 0; 
      z-index: 100; 
    }
    .brand { font-weight: bold; font-size: 1rem; color: #4a3b32; white-space: nowrap; }
    .cart-status { 
      background: #e8f5e9; 
      color: #2e7d32; 
      padding: 6px 12px; 
      border-radius: 20px; 
      font-weight: bold; 
      font-size: 0.85rem;
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      border: 1px solid #a5d6a7; 
      white-space: nowrap;
    }
    
    .category-header { background: #4a3b32; color: #fff; padding: 10px 14px; font-size: 1.05rem; font-weight: bold; border-radius: 6px; margin: 20px 0 12px 0; }
    .category-header:first-of-type { margin-top: 0; }
    
    .product-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
      gap: 15px; 
      margin-bottom: 20px; 
    }

    .product-card { 
      background: #fff; 
      border-radius: 10px; 
      padding: 15px; 
      border: 1px solid #e0e0e0; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .product-card img { 
      width: 100%; 
      height: 170px; 
      object-fit: cover; 
      border-radius: 8px; 
      margin-bottom: 10px; 
    }

    .product-title { font-size: 0.95rem; font-weight: bold; color: #333; margin-bottom: 3px; line-height: 1.2; }
    .product-variant { font-size: 0.8rem; color: #666; margin-bottom: 6px; font-weight: 500; }
    .product-price { color: #d32f2f; font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; }
    
    .topping-select { 
      width: 100%; 
      padding: 6px 8px; 
      border-radius: 6px; 
      border: 1px solid #ccc; 
      font-size: 0.8rem; 
      margin-bottom: 10px; 
      background: #fff; 
      color: #333; 
    }
    
    .qty-control { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .qty-btn { width: 28px; height: 28px; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .qty-input { width: 36px; text-align: center; border: 1px solid #ccc; border-radius: 4px; padding: 4px; font-weight: bold; font-size: 0.85rem; }
    
    .btn-add { 
      width: 100%; 
      background: #4a3b32; 
      color: #fff; 
      border: none; 
      padding: 8px 10px; 
      border-radius: 6px; 
      font-weight: bold; 
      font-size: 0.85rem; 
      cursor: pointer; 
      transition: background 0.2s;
    }
    .btn-add:hover { background: #332822; }

    .cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .cart-content { background: #fff; width: 92%; max-width: 400px; border-radius: 10px; padding: 18px; max-height: 85vh; overflow-y: auto; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px; }
    .close-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #888; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; border-bottom: 1px dashed #eee; padding-bottom: 5px; }
    .cart-total { font-weight: bold; font-size: 1rem; text-align: right; margin-top: 12px; color: #d32f2f; }
    .btn-checkout { width: 100%; background: #25D366; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 12px; cursor: pointer; font-size: 0.95rem; }

    footer { margin-top: 15px; background-color: #4a3b32; color: #f0e6df; padding: 12px; border-radius: 6px; font-size: 0.8rem; }
    .footer-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .footer-brand { font-weight: bold; color: #fff; }
    .footer-links a { color: #d7ccc8; text-decoration: none; margin-left: 8px; }
    .footer-copy { text-align: center; width: 100%; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; margin-top: 6px; font-size: 0.7rem; color: #bcaaa4; }
  </style>

  <!-- Pustaka Pembaca CSV Google Sheets -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
</head>
<body>

  <div class="top-bar">
    <div class="brand">🍰 Sorean Bake</div>
    <div class="cart-status" onclick="bukaKeranjang()">
      🛒 Keranjang (<span id="cart-count">0</span>)
    </div>
  </div>

  <div id="catalog-container">
    <p style="text-align:center; padding: 20px; color:#666;">Memuat data menu...</p>
  </div>

  <div id="cartModal" class="cart-modal">
    <div class="cart-content">
      <div class="cart-header">
        <h3>Keranjang Belanja</h3>
        <button class="close-btn" onclick="tutupKeranjang()">&times;</button>
      </div>
      <div id="cart-items-list">
        <p style="text-align:center; color:#888;">Keranjang masih kosong.</p>
      </div>
      <div class="cart-total" id="cart-total-price">Total: Rp 0</div>
      <button class="btn-checkout" onclick="kirimWhatsApp()">Konfirmasi & Pesan via WA</button>
    </div>
  </div>

  <footer>
    <div class="footer-container">
      <div class="footer-info">
        <div class="footer-brand">Sorean Bake</div>
        <div>Order Online via WhatsApp</div>
      </div>
      <div class="footer-links">
        <a href="https://wa.me/6287889667929/" target="_blank">💬 WA</a>
        <a href="https://www.instagram.com/soreanbake/" target="_blank">📷 IG</a>
      </div>
      <div class="footer-copy">
        &copy; 2026 Sorean Bake.
      </div>
    </div>
  </footer>

  <script>
    const nomorWA = "6287889667929";
    const URL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQUmFMSHvd6gaL6VaGqouFpKmpG7dYmTgei27iKEJaUE5J_I8iiGCnmjT2RruEGwfx715NLS62F8DUX/pub?gid=0&single=true&output=csv";

    // Data Penampung Dinamis
    let menuData = [];
    let keranjang = [];

    // Daftar Topping Statis (atau bisa diintegrasikan ke sheet terpisah nanti)
    const listTopping = [
      { nama: "Tanpa Topping", harga: 0 },
      { nama: "Peanut", harga: 5000 },
      { nama: "Keju", harga: 5000 },
      { nama: "Chocochips", harga: 4000 },
      { nama: "Sprinkle", harga: 7000 },
      { nama: "Oreo", harga: 8000 },
      { nama: "Almond Lotus", harga: 8000 },
      { nama: "Fresh Fruit", harga: 8000 }
    ];

    // Function Mengambil Data CSV dari Google Sheets
    async function loadDataDariGoogleSheets() {
      try {
        const response = await fetch(URL_GOOGLE_SHEETS);
        const dataCsv = await response.text();
        
        Papa.parse(dataCsv, {
          header: true,
          dynamicTyping: true,
          complete: function(results) {
            prosesAndRenderData(results.data);
          }
        });
      } catch (error) {
        console.error("Gagal mengambil data dari Google Sheets:", error);
        document.getElementById('catalog-container').innerHTML = '<p style="text-align:center; color:red;">Gagal memuat menu. Periksa koneksi internet.</p>';
      }
    }

    function prosesAndRenderData(dataRows) {
      menuData = [];
      
      dataRows.forEach(row => {
        if (!row.nama || !row.kategori) return; 
        
        let kat = menuData.find(x => x.kategori === row.kategori);
        if (!kat) {
          kat = { kategori: row.kategori, items: [] };
          menuData.push(kat);
        }
        
        kat.items.push({
          id: String(row.id),
          nama: row.nama,
          varian: row.varian,
          harga: Number(row.harga),
          img: row.img
        });
      });

      renderKatalog();
    }

    function renderKatalog() {
      const container = document.getElementById('catalog-container');
      container.innerHTML = '';

      if (menuData.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#888;">Belum ada menu yang tersedia.</p>';
        return;
      }

      menuData.forEach(kat => {
        let categoryHtml = `<div class="category-header">${kat.kategori}</div><div class="product-grid">`;
        
        kat.items.forEach(item => {
          let toppingOptionsHtml = `<select id="${item.id}-topping" class="topping-select">`;
          listTopping.forEach((top, index) => {
            const labelHarga = top.harga > 0 ? ` (+Rp ${top.harga.toLocaleString('id-ID')})` : '';
            toppingOptionsHtml += `<option value="${index}">${top.nama}${labelHarga}</option>`;
          });
          toppingOptionsHtml += `</select>`;

          categoryHtml += `
            <div class="product-card">
              <div>
                <img src="${item.img}" alt="${item.nama}">
                <div class="product-title">${item.nama}</div>
                <div class="product-variant">${item.varian}</div>
                <div class="product-price">Rp ${item.harga.toLocaleString('id-ID')}</div>
                ${toppingOptionsHtml}
              </div>
              <div>
                <div class="qty-control">
                  <button class="qty-btn" onclick="ubahQty('${item.id}', -1)">-</button>
                  <input type="number" id="${item.id}-qty" class="qty-input" value="1" min="1" readonly>
                  <button class="qty-btn" onclick="ubahQty('${item.id}', 1)">+</button>
                </div>
                <button class="btn-add" onclick="tambahKeKeranjang('${item.nama}', '${item.varian}', ${item.harga}, '${item.id}')">+ Keranjang</button>
              </div>
            </div>
          `;
        });

        categoryHtml += `</div>`;
        container.innerHTML += categoryHtml;
      });
    }

    function ubahQty(id, delta) {
      const input = document.getElementById(id + '-qty');
      let val = parseInt(input.value) + delta;
      if (val < 1) val = 1;
      input.value = val;
    }

    function tambahKeKeranjang(nama, varian, hargaDasar, itemId) {
      const qty = parseInt(document.getElementById(itemId + '-qty').value);
      const toppingIndex = document.getElementById(itemId + '-topping').value;
      const toppingSelected = listTopping[toppingIndex];

      const hargaTotalItem = hargaDasar + toppingSelected.harga;
      const toppingText = toppingSelected.harga > 0 ? ` [Topping: ${toppingSelected.nama}]` : '';
      const namaLengkap = `${nama} - ${varian}${toppingText}`;

      const index = keranjang.findIndex(item => item.nama === namaLengkap);
      if (index > -1) {
        keranjang[index].qty += qty;
      } else {
        keranjang.push({ nama: namaLengkap, harga: hargaTotalItem, qty });
      }

      document.getElementById(itemId + '-qty').value = 1;
      updateTampilanKeranjang();
      alert(`${namaLengkap} (${qty} pcs) ditambahkan!`);
    }

    function updateTampilanKeranjang() {
      const cartCount = document.getElementById('cart-count');
      const cartList = document.getElementById('cart-items-list');
      const cartTotal = document.getElementById('cart-total-price');

      let totalItems = 0;
      let totalPrice = 0;
      cartList.innerHTML = '';

      if (keranjang.length === 0) {
        cartList.innerHTML = '<p style="text-align:center; color:#888;">Keranjang masih kosong.</p>';
      } else {
        keranjang.forEach((item) => {
          totalItems += item.qty;
          const subtotal = item.harga * item.qty;
          totalPrice += subtotal;

          cartList.innerHTML += `
            <div class="cart-item">
              <div>
                <strong>${item.nama}</strong><br>
                <small>${item.qty} x Rp ${item.harga.toLocaleString('id-ID')}</small>
              </div>
              <div>Rp ${subtotal.toLocaleString('id-ID')}</div>
            </div>
          `;
        });
      }

      cartCount.innerText = totalItems;
      cartTotal.innerText = 'Total: Rp ' + totalPrice.toLocaleString('id-ID');
    }

    function bukaKeranjang() { document.getElementById('cartModal').style.display = 'flex'; }
    function tutupKeranjang() { document.getElementById('cartModal').style.display = 'none'; }

    function kirimWhatsApp() {
      if (keranjang.length === 0) {
        alert("Keranjang Anda masih kosong!");
        return;
      }

      let pesan = "Halo Sorean Bake, saya mau konfirmasi pesanan berikut:%0A%0A";
      let total = 0;

      keranjang.forEach(item => {
        const subtotal = item.harga * item.qty;
        total += subtotal;
        pesan += `- ${item.nama} (${item.qty} pcs) = Rp ${subtotal.toLocaleString('id-ID')}%0A`;
      });

      pesan += `%0A*Total Belanja :* Rp ${total.toLocaleString('id-ID')}`;
      pesan += "%0A%0AMohon diinformasikan alur pembayaran dan pengirimannya. Terima kasih!";

      window.open("https://wa.me/" + nomorWA + "?text=" + pesan, "_blank");
    }

    // Jalankan pemanggilan data otomatis saat halaman dibuka
    loadDataDariGoogleSheets();
  </script>
</body>
</html>
