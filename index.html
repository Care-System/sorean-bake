<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { padding: 15px; background-color: #f9f9f9; }
    
    /* Header Navbar Ringkas */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; position: sticky; top: 0; z-index: 100; }
    .brand { font-weight: bold; font-size: 1.1rem; color: #4a3b32; }
    .cart-status { background: #e8f5e9; color: #2e7d32; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; border: 1px solid #a5d6a7; }
    
    /* Grid Katalog Produk */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .product-card { background: #fff; border-radius: 8px; padding: 12px; border: 1px solid #eee; display: flex; flex-direction: column; justify-content: space-between; }
    .product-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
    .product-title { font-size: 0.95rem; font-weight: bold; color: #333; margin-bottom: 4px; }
    .product-price { color: #d32f2f; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; }
    
    /* Kontrol Jumlah & Tombol */
    .qty-control { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .qty-btn { width: 28px; height: 28px; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .qty-input { width: 40px; text-align: center; border: 1px solid #ccc; border-radius: 4px; padding: 3px; font-weight: bold; }
    .btn-add { width: 100%; background: #4a3b32; color: #fff; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-add:hover { background: #332822; }

    /* Modal / Pop-up Keranjang Konfirmasi */
    .cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .cart-content { background: #fff; width: 90%; max-width: 400px; border-radius: 10px; padding: 20px; max-height: 80vh; overflow-y: auto; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
    .close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #888; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; border-bottom: 1px dashed #eee; padding-bottom: 5px; }
    .cart-total { font-weight: bold; font-size: 1rem; text-align: right; margin-top: 15px; color: #d32f2f; }
    .btn-checkout { width: 100%; background: #25D366; color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; margin-top: 15px; cursor: pointer; font-size: 0.95rem; }
  </style>
</head>
<body>

  <!-- Menu Atas (Header & Ringkasan Keranjang) -->
  <div class="top-bar">
    <div class="brand">🍰 Sorean Bake</div>
    <div class="cart-status" onclick="bukaKeranjang()">
      🛒 Keranjang (<span id="cart-count">0</span>)
    </div>
  </div>

  <!-- Katalog Produk Sorean Bake -->
  <div class="product-grid">
    
    <!-- Produk 1 -->
    <div class="product-card">
      <div>
        <img src="https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=300" alt="Fudgy Brownies">
        <div class="product-title">Fudgy Brownies</div>
        <div class="product-price">Rp 25.000</div>
      </div>
      <div>
        <div class="qty-control">
          <button class="qty-btn" onclick="ubahQty('p1', -1)">-</button>
          <input type="number" id="p1-qty" class="qty-input" value="1" min="1" readonly>
          <button class="qty-btn" onclick="ubahQty('p1', 1)">+</button>
        </div>
        <button class="btn-add" onclick="tambahKeKeranjang('Fudgy Brownies', 25000, 'p1-qty')">+ Keranjang</button>
      </div>
    </div>

    <!-- Produk 2 -->
    <div class="product-card">
      <div>
        <img src="https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=300" alt="Cookies Red Velvet">
        <div class="product-title">Cookies Red Velvet</div>
        <div class="product-price">Rp 15.000</div>
      </div>
      <div>
        <div class="qty-control">
          <button class="qty-btn" onclick="ubahQty('p2', -1)">-</button>
          <input type="number" id="p2-qty" class="qty-input" value="1" min="1" readonly>
          <button class="qty-btn" onclick="ubahQty('p2', 1)">+</button>
        </div>
        <button class="btn-add" onclick="tambahKeKeranjang('Cookies Red Velvet', 15000, 'p2-qty')">+ Keranjang</button>
      </div>
    </div>

  </div>

  <!-- Pop-Up Keranjang Belanja -->
  <div id="cartModal" class="cart-modal">
    <div class="cart-content">
      <div class="cart-header">
        <h3>Keranjang Belanja</h3>
        <button class="close-btn" onclick="tutupKeranjang()">&times;</button>
      </div>
      <div id="cart-items-list">
        <p style="text-align:center; color:#888;">Keranjang masih kosong.</p>
      </div>
      <div class="cart-total" id="cart-total-price">Total: Rp 0</div>
      <button class="btn-checkout" onclick="kirimWhatsApp()">Konfirmasi & Pesan via WA</button>
    </div>
  </div>

  <script>
    // MASUKKAN NOMOR WHATSAPP TOKO (Gunakan Awalan 62)
    const nomorWA = "6287889667929";

    let keranjang = [];

    function ubahQty(id, delta) {
      const input = document.getElementById(id + '-qty');
      let val = parseInt(input.value) + delta;
      if (val < 1) val = 1;
      input.value = val;
    }

    function tambahKeKeranjang(nama, harga, qtyId) {
      const qty = parseInt(document.getElementById(qtyId).value);
      
      // Cek apakah item sudah ada di keranjang
      const index = keranjang.findIndex(item => item.nama === nama);
      if (index > -1) {
        keranjang[index].qty += qty;
      } else {
        keranjang.push({ nama, harga, qty });
      }

      // Reset input jumlah kembali ke 1
      document.getElementById(qtyId).value = 1;
      updateTampilanKeranjang();
      alert(nama + " (" + qty + " pcs) berhasil ditambahkan!");
    }

    function updateTampilanKeranjang() {
      const cartCount = document.getElementById('cart-count');
      const cartList = document.getElementById('cart-items-list');
      const cartTotal = document.getElementById('cart-total-price');

      let totalItems = 0;
      let totalPrice = 0;
      cartList.innerHTML = '';

      if (keranjang.length === 0) {
        cartList.innerHTML = '<p style="text-align:center; color:#888;">Keranjang masih kosong.</p>';
      } else {
        keranjang.forEach((item, i) => {
          totalItems += item.qty;
          const subtotal = item.harga * item.qty;
          totalPrice += subtotal;

          cartList.innerHTML += `
            <div class="cart-item">
              <div>
                <strong>${item.nama}</strong><br>
                <small>${item.qty} x Rp ${item.harga.toLocaleString('id-ID')}</small>
              </div>
              <div>Rp ${subtotal.toLocaleString('id-ID')}</div>
            </div>
          `;
        });
      }

      cartCount.innerText = totalItems;
      cartTotal.innerText = 'Total: Rp ' + totalPrice.toLocaleString('id-ID');
    }

    function bukaKeranjang() {
      document.getElementById('cartModal').style.display = 'flex';
    }

    function tutupKeranjang() {
      document.getElementById('cartModal').style.display = 'none';
    }

    function kirimWhatsApp() {
      if (keranjang.length === 0) {
        alert("Keranjang Anda masih kosong!");
        return;
      }

      let pesan = "Halo Toko Sorean Bake, saya mau konfirmasi pesanan berikut:%0A%0A";
      let total = 0;

      keranjang.forEach(item => {
        const subtotal = item.harga * item.qty;
        total += subtotal;
        pesan += `- ${item.nama} (${item.qty} pcs) = Rp ${subtotal.toLocaleString('id-ID')}%0A`;
      });

      pesan += `%0A*Total Pembayaran:* Rp ${total.toLocaleString('id-ID')}`;
      pesan += "%0A%0AMohon diinformasikan alur pembayaran dan pengirimannya. Terima kasih!";

      window.open("https://wa.me/" + nomorWA + "?text=" + pesan, "_blank");
    }
  </script>
</body>
</html>
