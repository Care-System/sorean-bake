<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    html, body { background-color: #ffffff; overflow-x: hidden; }
    body { padding: 5px; }

    /* Cart Button Ringkas & Non-Sticky */
    .cart-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #e8f5e9; border-radius: 6px; margin-bottom: 10px; border: 1px solid #a5d6a7; }
    .cart-btn { background: #2e7d32; color: #fff; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; cursor: pointer; border: none; }

    .category-title { background: #4a3b32; color: #fff; padding: 6px 10px; font-size: 0.9rem; font-weight: bold; border-radius: 4px; margin: 10px 0 8px 0; }
    
    /* Layout Grid 1 Kolom untuk Layar Sempit */
    .product-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .product-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 8px; display: flex; gap: 10px; align-items: center; }
    .product-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    .product-info { flex: 1; }
    .product-title { font-size: 0.85rem; font-weight: bold; color: #333; }
    .product-variant { font-size: 0.75rem; color: #666; margin-bottom: 2px; }
    .product-price { color: #d32f2f; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; }
    
    .topping-select { width: 100%; padding: 3px; font-size: 0.75rem; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 5px; }
    .action-row { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
    .qty-control { display: flex; align-items: center; gap: 4px; }
    .qty-btn { width: 22px; height: 22px; border: 1px solid #ccc; background: #f0f0f0; border-radius: 3px; font-weight: bold; cursor: pointer; }
    .qty-input { width: 26px; text-align: center; border: 1px solid #ccc; border-radius: 3px; font-size: 0.75rem; }
    .btn-add { background: #4a3b32; color: #fff; border: none; padding: 5px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }

    /* Modal Pop-up */
    .cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .cart-content { background: #fff; width: 90%; max-width: 350px; border-radius: 8px; padding: 15px; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 6px; margin-bottom: 8px; }
    .cart-item { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 6px; }
    .btn-checkout { width: 100%; background: #25D366; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; margin-top: 10px; cursor: pointer; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="cart-bar">
    <span style="font-size:0.85rem; font-weight:bold; color:#2e7d32;">🛒 Total: <span id="cart-count">0</span> Item</span>
    <button class="cart-btn" onclick="bukaKeranjang()">Lihat Keranjang</button>
  </div>

  <div id="catalog-container"></div>

  <div id="cartModal" class="cart-modal">
    <div class="cart-content">
      <div class="cart-header">
        <h4 style="margin:0;">Keranjang Belanja</h4>
        <button onclick="tutupKeranjang()" style="border:none; background:none; font-size:1.1rem; cursor:pointer;">&times;</button>
      </div>
      <div id="cart-items-list"><p style="text-align:center; color:#888; font-size:0.8rem;">Keranjang kosong.</p></div>
      <div style="font-weight:bold; font-size:0.9rem; text-align:right; margin-top:10px; color:#d32f2f;" id="cart-total-price">Total: Rp 0</div>
      <button class="btn-checkout" onclick="kirimWhatsApp()">Pesan via WhatsApp</button>
    </div>
  </div>

  <script>
    const nomorWA = "6287889667929";
    const listTopping = [
      { nama: "Tanpa Topping", harga: 0 },
      { nama: "Peanut", harga: 5000 },
      { nama: "Keju", harga: 5000 },
      { nama: "Chocochips", harga: 4000 }
    ];

    const menuData = [
      {
        kategori: "🍫 Fudgy Brownies",
        items: [
          { id: "br-s", nama: "Fudgy Brownies", varian: "Mini (10x10)", harga: 25000, img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=150" },
          { id: "br-m", nama: "Fudgy Brownies", varian: "Medium (20x10)", harga: 49000, img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=150" }
        ]
      },
      {
        kategori: "🧀 Basque Cheesecake",
        items: [
          { id: "bc-s", nama: "Burnt Cheesecake", varian: "Mini (10D)", harga: 35000, img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=150" }
        ]
      }
    ];

    let keranjang = [];

    function renderKatalog() {
      const container = document.getElementById('catalog-container');
      container.innerHTML = '';
      menuData.forEach(kat => {
        let html = `<div class="category-title">${kat.kategori}</div><div class="product-grid">`;
        kat.items.forEach(item => {
          let topHtml = `<select id="${item.id}-top" class="topping-select">`;
          listTopping.forEach((t, i) => topHtml += `<option value="${i}">${t.nama} ${t.harga>0?'+Rp'+t.harga:''}</option>`);
          topHtml += `</select>`;

          html += `
            <div class="product-card">
              <img src="${item.img}">
              <div class="product-info">
                <div class="product-title">${item.nama}</div>
                <div class="product-variant">${item.varian}</div>
                <div class="product-price">Rp ${item.harga.toLocaleString('id-ID')}</div>
                ${topHtml}
                <div class="action-row">
                  <div class="qty-control">
                    <button class="qty-btn" onclick="ubahQty('${item.id}', -1)">-</button>
                    <input type="number" id="${item.id}-qty" class="qty-input" value="1" readonly>
                    <button class="qty-btn" onclick="ubahQty('${item.id}', 1)">+</button>
                  </div>
                  <button class="btn-add" onclick="tambah('${item.nama}', '${item.varian}', ${item.harga}, '${item.id}')">+ Beli</button>
                </div>
              </div>
            </div>`;
        });
        html += `</div>`;
        container.innerHTML += html;
      });
    }

    function ubahQty(id, d) {
      let el = document.getElementById(id + '-qty');
      let v = parseInt(el.value) + d;
      if (v >= 1) el.value = v;
    }

    function tambah(nama, varian, harga, id) {
      let q = parseInt(document.getElementById(id + '-qty').value);
      let tIdx = document.getElementById(id + '-top').value;
      let top = listTopping[tIdx];
      let itemNama = `${nama} (${varian}) ${top.harga>0 ? '['+top.nama+']' : ''}`;
      let totalHarga = harga + top.harga;

      let idx = keranjang.findIndex(x => x.nama === itemNama);
      if (idx > -1) keranjang[idx].qty += q;
      else keranjang.push({ nama: itemNama, harga: totalHarga, qty: q });

      updateCart();
      alert("Berhasil ditambahkan!");
    }

    function updateCart() {
      let count = 0, total = 0, list = '';
      keranjang.forEach(x => {
        count += x.qty;
        let sub = x.harga * x.qty;
        total += sub;
        list += `<div class="cart-item"><span>${x.nama} x${x.qty}</span><span>Rp ${sub.toLocaleString('id-ID')}</span></div>`;
      });
      document.getElementById('cart-count').innerText = count;
      document.getElementById('cart-items-list').innerHTML = list || '<p style="text-align:center; color:#888; font-size:0.8rem;">Keranjang kosong.</p>';
      document.getElementById('cart-total-price').innerText = 'Total: Rp ' + total.toLocaleString('id-ID');
    }

    function bukaKeranjang() { document.getElementById('cartModal').style.display = 'flex'; }
    function tutupKeranjang() { document.getElementById('cartModal').style.display = 'none'; }

    function kirimWhatsApp() {
      if (!keranjang.length) return alert("Keranjang kosong!");
      let pesan = "Halo Sorean Bake, saya mau pesan:%0A%0A", total = 0;
      keranjang.forEach(x => {
        let sub = x.harga * x.qty;
        total += sub;
        pesan += `- ${x.nama} (${x.qty}x) = Rp ${sub.toLocaleString('id-ID')}%0A`;
      });
      pesan += `%0A*Total:* Rp ${total.toLocaleString('id-ID')}`;
      window.open("https://wa.me/" + nomorWA + "?text=" + pesan, "_blank");
    }

    renderKatalog();
  </script>
</body>
</html>
